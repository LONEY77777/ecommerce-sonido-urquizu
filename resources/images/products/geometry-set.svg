<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A geometry set with compass, set square, protractor and ruler">
    <rect width="400" height="400" fill="#ecfdf5"/>
    <ellipse cx="200" cy="338" rx="134" ry="15" fill="#064e3b" opacity=".08"/>

    <!-- Protractor -->
    <g transform="translate(132 244)">
        <path d="M-76 0 A76 76 0 0 1 76 0 Z" fill="#a7f3d0" opacity=".85"/>
        <path d="M-76 0 A76 76 0 0 1 76 0 Z" fill="none" stroke="#059669" stroke-width="4"/>
        <path d="M-56 0 A56 56 0 0 1 56 0" fill="none" stroke="#047857" stroke-width="3" opacity=".6"/>
        <g stroke="#047857" stroke-width="3">
            <path d="M-76 0 L-64 0"/><path d="M-66 -37 L-56 -31"/><path d="M-38 -66 L-32 -56"/>
            <path d="M0 -76 L0 -64"/><path d="M38 -66 L32 -56"/><path d="M66 -37 L56 -31"/><path d="M76 0 L64 0"/>
        </g>
        <circle cx="0" cy="0" r="5" fill="#047857"/>
    </g>

    <!-- Set square -->
    <g transform="translate(268 250) rotate(-8)">
        <path d="M-58 56 L-58 -72 L60 56 Z" fill="#bfdbfe" opacity=".8"/>
        <path d="M-58 56 L-58 -72 L60 56 Z" fill="none" stroke="#2563eb" stroke-width="4" stroke-linejoin="round"/>
        <path d="M-34 32 L-34 -14 L12 32 Z" fill="#ecfdf5"/>
        <g stroke="#2563eb" stroke-width="3">
            <path d="M-58 30 L-48 30"/><path d="M-58 6 L-48 6"/><path d="M-58 -18 L-48 -18"/><path d="M-58 -42 L-48 -42"/>
        </g>
    </g>

    <!-- Compass -->
    <g transform="translate(198 148)">
        <circle cx="0" cy="-72" r="12" fill="#64748b"/>
        <rect x="-4" y="-96" width="8" height="24" rx="4" fill="#94a3b8"/>
        <path d="M-2 -64 L-40 62" stroke="#94a3b8" stroke-width="10" stroke-linecap="round"/>
        <path d="M2 -64 L40 62" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/>
        <path d="M-40 56 L-44 76" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
        <path d="M40 56 L44 74" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Ruler -->
    <g transform="translate(200 316)">
        <rect x="-146" y="-14" width="292" height="28" rx="5" fill="#fcd34d"/>
        <rect x="-146" y="-14" width="292" height="9" rx="4" fill="#fbbf24"/>
        <g stroke="#92400e" stroke-width="3">
            <path d="M-120 14 L-120 -2"/><path d="M-90 14 L-90 4"/><path d="M-60 14 L-60 -2"/><path d="M-30 14 L-30 4"/>
            <path d="M0 14 L0 -2"/><path d="M30 14 L30 4"/><path d="M60 14 L60 -2"/><path d="M90 14 L90 4"/><path d="M120 14 L120 -2"/>
        </g>
    </g>
</svg>
