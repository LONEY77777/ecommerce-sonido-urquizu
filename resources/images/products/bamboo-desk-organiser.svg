<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A bamboo desk organiser holding pens and stationery">
    <rect width="400" height="400" fill="#f0fdfa"/>
    <ellipse cx="200" cy="330" rx="136" ry="17" fill="#134e4a" opacity=".08"/>

    <!-- Contents poking out of the compartments -->
    <g>
        <rect x="98" y="118" width="14" height="86" rx="6" fill="#0d9488"/>
        <rect x="118" y="104" width="14" height="100" rx="6" fill="#4f46e5"/>
        <rect x="138" y="126" width="14" height="78" rx="6" fill="#f97316"/>
        <!-- Scissors -->
        <g transform="translate(206 150)">
            <path d="M-12 -46 L6 20" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
            <path d="M12 -46 L-6 20" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round"/>
            <circle cx="-8" cy="30" r="9" fill="none" stroke="#0d9488" stroke-width="6"/>
            <circle cx="8" cy="30" r="9" fill="none" stroke="#0d9488" stroke-width="6"/>
        </g>
        <!-- Sticky note block -->
        <rect x="256" y="140" width="56" height="64" rx="3" fill="#fbbf24"/>
        <rect x="256" y="140" width="56" height="8" fill="#f59e0b"/>
    </g>

    <!-- Organiser body -->
    <path d="M74 196 L326 196 L312 312 L88 312 Z" fill="#d6b483"/>
    <path d="M74 196 L326 196 L320 226 L80 226 Z" fill="#e8cfa8"/>

    <!-- Compartment dividers -->
    <g stroke="#b08a58" stroke-width="5">
        <path d="M164 200 L160 310"/>
        <path d="M240 200 L244 310"/>
    </g>

    <!-- Bamboo grain -->
    <g stroke="#c19a68" stroke-width="3" opacity=".6">
        <path d="M96 240 L96 306"/>
        <path d="M124 240 L124 306"/>
        <path d="M196 240 L196 306"/>
        <path d="M276 240 L276 306"/>
        <path d="M300 240 L300 306"/>
    </g>

    <!-- Felt feet -->
    <rect x="96" y="312" width="26" height="10" rx="4" fill="#334155"/>
    <rect x="278" y="312" width="26" height="10" rx="4" fill="#334155"/>
</svg>
