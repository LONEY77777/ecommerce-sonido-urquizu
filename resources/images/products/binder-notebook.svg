<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A refillable six ring hardcover binder notebook">
    <rect width="400" height="400" fill="#fffbeb"/>
    <ellipse cx="200" cy="334" rx="140" ry="16" fill="#78350f" opacity=".08"/>

    <!-- Open binder, two facing pages -->
    <path d="M52 96 L196 76 L196 306 L52 322 Z" fill="#1e3a5f"/>
    <path d="M348 96 L204 76 L204 306 L348 322 Z" fill="#274b7a"/>

    <path d="M64 108 L192 90 L192 296 L64 310 Z" fill="#fefdfb"/>
    <path d="M336 108 L208 90 L208 296 L336 310 Z" fill="#f8fafc"/>

    <!-- Dot grid on the left page -->
    <g fill="#cbd5e1">
        <g><circle cx="84" cy="140" r="2"/><circle cx="106" cy="137" r="2"/><circle cx="128" cy="134" r="2"/><circle cx="150" cy="131" r="2"/><circle cx="172" cy="128" r="2"/></g>
        <g><circle cx="84" cy="170" r="2"/><circle cx="106" cy="167" r="2"/><circle cx="128" cy="164" r="2"/><circle cx="150" cy="161" r="2"/><circle cx="172" cy="158" r="2"/></g>
        <g><circle cx="84" cy="200" r="2"/><circle cx="106" cy="197" r="2"/><circle cx="128" cy="194" r="2"/><circle cx="150" cy="191" r="2"/><circle cx="172" cy="188" r="2"/></g>
        <g><circle cx="84" cy="230" r="2"/><circle cx="106" cy="227" r="2"/><circle cx="128" cy="224" r="2"/><circle cx="150" cy="221" r="2"/><circle cx="172" cy="218" r="2"/></g>
        <g><circle cx="84" cy="260" r="2"/><circle cx="106" cy="257" r="2"/><circle cx="128" cy="254" r="2"/><circle cx="150" cy="251" r="2"/><circle cx="172" cy="248" r="2"/></g>
    </g>

    <!-- Handwriting on the right page -->
    <g stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity=".75">
        <path d="M226 136 L316 146"/>
        <path d="M226 166 L316 176"/>
        <path d="M226 196 L286 202"/>
        <path d="M226 226 L316 236"/>
    </g>

    <!-- Six rings down the spine -->
    <g stroke="#cbd5e1" stroke-width="6" fill="none">
        <path d="M200 100 m-9 0 a9 11 0 1 0 18 0 a9 11 0 1 0 -18 0"/>
        <path d="M200 140 m-9 0 a9 11 0 1 0 18 0 a9 11 0 1 0 -18 0"/>
        <path d="M200 180 m-9 0 a9 11 0 1 0 18 0 a9 11 0 1 0 -18 0"/>
        <path d="M200 220 m-9 0 a9 11 0 1 0 18 0 a9 11 0 1 0 -18 0"/>
        <path d="M200 260 m-9 0 a9 11 0 1 0 18 0 a9 11 0 1 0 -18 0"/>
        <path d="M200 296 m-9 0 a9 11 0 1 0 18 0 a9 11 0 1 0 -18 0"/>
    </g>

    <!-- Pen loop with a pen -->
    <rect x="330" y="150" width="16" height="120" rx="8" fill="#1e3a5f"/>
    <rect x="332" y="132" width="12" height="150" rx="6" fill="#0d9488"/>
</svg>
