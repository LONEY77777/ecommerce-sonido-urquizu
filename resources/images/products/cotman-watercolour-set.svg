<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="An open tin of watercolour half pans with a brush">
    <rect width="400" height="400" fill="#fdf2f8"/>
    <ellipse cx="200" cy="336" rx="130" ry="16" fill="#831843" opacity=".08"/>

    <!-- Lid, propped open as a mixing palette -->
    <path d="M74 168 L326 168 L306 74 L94 74 Z" fill="#cbd5e1"/>
    <path d="M86 160 L314 160 L297 84 L103 84 Z" fill="#f1f5f9"/>
    <g opacity=".55">
        <ellipse cx="150" cy="122" rx="26" ry="16" fill="#60a5fa"/>
        <ellipse cx="212" cy="128" rx="22" ry="13" fill="#f472b6"/>
        <ellipse cx="262" cy="118" rx="18" ry="11" fill="#fbbf24"/>
    </g>

    <!-- Tin base holding the pans -->
    <rect x="66" y="184" width="268" height="128" rx="12" fill="#94a3b8"/>
    <rect x="76" y="192" width="248" height="112" rx="8" fill="#e2e8f0"/>

    <!-- Twelve half pans -->
    <g>
        <rect x="88" y="204" width="36" height="44" rx="3" fill="#dc2626"/>
        <rect x="130" y="204" width="36" height="44" rx="3" fill="#f97316"/>
        <rect x="172" y="204" width="36" height="44" rx="3" fill="#facc15"/>
        <rect x="214" y="204" width="36" height="44" rx="3" fill="#65a30d"/>
        <rect x="256" y="204" width="36" height="44" rx="3" fill="#0d9488"/>
        <rect x="298" y="204" width="18" height="44" rx="3" fill="#0284c7"/>

        <rect x="88" y="252" width="36" height="44" rx="3" fill="#1d4ed8"/>
        <rect x="130" y="252" width="36" height="44" rx="3" fill="#6d28d9"/>
        <rect x="172" y="252" width="36" height="44" rx="3" fill="#be185d"/>
        <rect x="214" y="252" width="36" height="44" rx="3" fill="#78350f"/>
        <rect x="256" y="252" width="36" height="44" rx="3" fill="#1f2937"/>
        <rect x="298" y="252" width="18" height="44" rx="3" fill="#f8fafc"/>
    </g>

    <!-- Travel brush -->
    <g transform="rotate(-24 200 330)">
        <rect x="112" y="322" width="150" height="14" rx="7" fill="#0f172a"/>
        <rect x="256" y="322" width="26" height="14" fill="#cbd5e1"/>
        <path d="M282 322 L318 326 L318 332 L282 336 Z" fill="#b45309"/>
    </g>
</svg>
