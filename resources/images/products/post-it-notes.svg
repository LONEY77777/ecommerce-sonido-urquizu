<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Pads of sticky notes in assorted bright colours">
    <rect width="400" height="400" fill="#fffbeb"/>
    <ellipse cx="200" cy="336" rx="128" ry="16" fill="#78350f" opacity=".08"/>

    <!-- Fanned pads -->
    <g transform="rotate(-11 150 210)">
        <rect x="72" y="140" width="140" height="140" rx="4" fill="#22d3ee"/>
        <rect x="72" y="140" width="140" height="12" rx="4" fill="#06b6d4"/>
        <g stroke="#0e7490" stroke-width="4" stroke-linecap="round" opacity=".5">
            <path d="M92 186 L188 186"/><path d="M92 208 L188 208"/><path d="M92 230 L156 230"/>
        </g>
    </g>

    <g transform="rotate(6 250 200)">
        <rect x="188" y="128" width="140" height="140" rx="4" fill="#f472b6"/>
        <rect x="188" y="128" width="140" height="12" rx="4" fill="#ec4899"/>
        <g stroke="#9d174d" stroke-width="4" stroke-linecap="round" opacity=".45">
            <path d="M208 174 L304 174"/><path d="M208 196 L304 196"/><path d="M208 218 L268 218"/>
        </g>
    </g>

    <!-- Front pad, curled corner -->
    <g transform="rotate(-3 200 268)">
        <path d="M128 196 L272 196 L272 320 L156 320 L128 292 Z" fill="#fbbf24"/>
        <rect x="128" y="196" width="144" height="12" fill="#f59e0b"/>
        <path d="M128 292 L156 320 L156 292 Z" fill="#d97706"/>
        <g stroke="#92400e" stroke-width="4" stroke-linecap="round" opacity=".5">
            <path d="M148 242 L252 242"/><path d="M148 266 L252 266"/><path d="M170 290 L252 290"/>
        </g>
    </g>
</svg>
