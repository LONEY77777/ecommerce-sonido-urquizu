    <g transform="translate(200 256)">
        <rect x="-22" y="-66" width="44" height="112" rx="10" fill="#34d399"/>
        <rect x="-22" y="-66" width="44" height="26" rx="10" fill="#10b981"/>
        <rect x="-22" y="30" width="44" height="12" fill="#059669"/>
        <path d="M-16 42 L16 42 L10 74 L-10 74 Z" fill="#a7f3d0"/>
        <path d="M-10 66 L10 66 L10 74 L-10 74 Z" fill="#047857"/>
