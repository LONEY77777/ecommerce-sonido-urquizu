        <rect x="-22" y="-66" width="44" height="26" rx="10" fill="#eab308"/>
        <rect x="-22" y="30" width="44" height="12" fill="#ca8a04"/>
        <path d="M-16 42 L16 42 L10 74 L-10 74 Z" fill="#fef08a"/>
        <path d="M-10 66 L10 66 L10 74 L-10 74 Z" fill="#a16207"/>
