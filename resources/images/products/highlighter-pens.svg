    <g transform="translate(276 262) rotate(10)">
        <rect x="-22" y="-66" width="44" height="112" rx="10" fill="#60a5fa"/>
        <rect x="-22" y="-66" width="44" height="26" rx="10" fill="#3b82f6"/>
        <rect x="-22" y="30" width="44" height="12" fill="#2563eb"/>
        <path d="M-16 42 L16 42 L10 74 L-10 74 Z" fill="#bfdbfe"/>
