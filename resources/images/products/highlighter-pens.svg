<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Chisel tip highlighter pens in pastel shades">
    <rect width="400" height="400" fill="#ecfdf5"/>
    <ellipse cx="200" cy="338" rx="128" ry="15" fill="#064e3b" opacity=".08"/>

    <!-- Highlighted text lines behind -->
    <g>
        <rect x="72" y="70" width="180" height="20" rx="10" fill="#fde68a" opacity=".85"/>
        <rect x="72" y="106" width="230" height="20" rx="10" fill="#bbf7d0" opacity=".85"/>
        <rect x="72" y="142" width="150" height="20" rx="10" fill="#bfdbfe" opacity=".85"/>
        <g fill="#94a3b8" opacity=".7">
            <rect x="80" y="76" width="120" height="8" rx="4"/>
            <rect x="80" y="112" width="190" height="8" rx="4"/>
            <rect x="80" y="148" width="100" height="8" rx="4"/>
        </g>
    </g>

    <!-- Three highlighters, chisel tips down -->
