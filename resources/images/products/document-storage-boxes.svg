<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Stacked corrugated document storage boxes with lift-off lids">
    <rect width="400" height="400" fill="#f0f9ff"/>
    <ellipse cx="200" cy="336" rx="138" ry="16" fill="#0c4a6e" opacity=".08"/>

    <!-- Upper box, lid slightly ajar -->
    <g>
        <path d="M104 118 L296 118 L282 168 L118 168 Z" fill="#cbd5e1"/>
        <rect x="112" y="164" width="176" height="76" rx="4" fill="#d8c3a5"/>
        <rect x="112" y="164" width="176" height="12" fill="#c4ab89"/>
        <!-- Hand hole -->
        <rect x="176" y="192" width="48" height="14" rx="7" fill="#8f7a5c"/>
        <!-- Label -->
        <rect x="126" y="188" width="40" height="26" rx="3" fill="#f8fafc"/>
        <g stroke="#94a3b8" stroke-width="3">
            <path d="M132 198 L160 198"/><path d="M132 206 L152 206"/>
        </g>
    </g>

    <!-- Lower box -->
    <g>
        <rect x="94" y="240" width="212" height="88" rx="4" fill="#e0cdb0"/>
        <rect x="94" y="240" width="212" height="14" fill="#c4ab89"/>
        <rect x="176" y="274" width="48" height="14" rx="7" fill="#8f7a5c"/>
        <rect x="110" y="268" width="44" height="30" rx="3" fill="#f8fafc"/>
        <g stroke="#94a3b8" stroke-width="3">
            <path d="M117 279 L147 279"/><path d="M117 288 L139 288"/>
        </g>
        <!-- Corrugated edge -->
        <g stroke="#c4ab89" stroke-width="3" opacity=".8">
            <path d="M250 254 L250 324"/><path d="M264 254 L264 324"/><path d="M278 254 L278 324"/><path d="M292 254 L292 324"/>
        </g>
    </g>
</svg>
